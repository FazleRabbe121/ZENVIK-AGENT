name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Live Cloud Run Backend URL to bind inside the Android APK (leave blank to auto-detect)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate, Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Optional Auto-Detect of Live Cloud Run Backend)
        if: inputs.backend_url == '' && vars.ZENVIK_BACKEND_URL == '' && secrets.ZENVIK_BACKEND_URL == '' && secrets.GCP_SA_KEY != ''
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK (Optional Auto-Detect)
        if: inputs.backend_url == '' && vars.ZENVIK_BACKEND_URL == '' && secrets.ZENVIK_BACKEND_URL == '' && secrets.GCP_SA_KEY != ''
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve Live Full-Stack Backend URL
        id: backend
        env:
          INPUT_URL: ${{ inputs.backend_url }}
          VAR_URL: ${{ vars.ZENVIK_BACKEND_URL }}
          SECRET_URL: ${{ secrets.ZENVIK_BACKEND_URL }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'ace-mission-353410' }}
        run: |
          BACKEND_URL=""
          if [ -n "$INPUT_URL" ]; then
            BACKEND_URL="$INPUT_URL"
          elif [ -n "$VAR_URL" ]; then
            BACKEND_URL="$VAR_URL"
          elif [ -n "$SECRET_URL" ]; then
            BACKEND_URL="$SECRET_URL"
          elif command -v gcloud >/dev/null 2>&1; then
            DETECTED=$(gcloud run services describe zenvik-agent-backend --project "$PROJECT_ID" --region europe-west2 --format='value(status.url)' 2>/dev/null || true)
            if [ -n "$DETECTED" ]; then
              BACKEND_URL="$DETECTED"
            fi
          fi

          if [ -z "$BACKEND_URL" ]; then
            BACKEND_URL="https://ais-pre-3gibrfsvo4w6s27pi4qcyj-889586963829.europe-west2.run.app"
          fi

          BACKEND_URL="${BACKEND_URL%/}"
          echo "url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          echo "Binding Android APK to Live Backend URL: $BACKEND_URL"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # No npm lockfile is committed yet; skip setup-node's lockfile cache lookup.

      - name: Install Frontend & Backend Dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript Validation
        run: npm run lint

      - name: Run Automated Unit & Integration Tests
        run: npm test

      - name: Build Production Web Application
        run: npm run build
        env:
          VITE_BACKEND_URL: ${{ steps.backend.outputs.url }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}

      - name: Bundle Web Assets into Android Assets (WebViewAssetLoader)
        run: |
          rm -rf android/app/src/main/assets/dist
          mkdir -p android/app/src/main/assets/dist
          cp -r dist/* android/app/src/main/assets/dist/
          rm -rf android/app/src/main/assets/dist/assets/aistudio android/app/src/main/assets/dist/*.zip

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        env:
          ZENVIK_BACKEND_URL: ${{ steps.backend.outputs.url }}
        run: |
          ./gradlew assembleDebug -PZENVIK_BACKEND_URL="${{ steps.backend.outputs.url }}" --stacktrace || gradle assembleDebug -PZENVIK_BACKEND_URL="${{ steps.backend.outputs.url }}" --stacktrace

      - name: Prepare Named APK Artifacts
        id: apk_path
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: APK file was not generated."
            exit 1
          fi
          cp "$APK_FILE" android/app/build/outputs/apk/debug/ZENVIK-AGENT-debug.apk
          echo "Found APK: $APK_FILE"
          echo "apk_file=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Upload ZENVIK Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZENVIK-AGENT-Android-Debug-APK
          path: |
            android/app/build/outputs/apk/debug/ZENVIK-AGENT-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish Latest Debug APK to GitHub Releases
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-debug
          name: ZENVIK Agent v1.0.0 (Debug APK Build)
          body: |
            Automated Android Debug APK build from commit `${{ github.sha }}`.
            - **Package ID**: `com.ccd.abetteryou.debug` (Base ID: `com.ccd.abetteryou`)
            - **Version**: `1.0.0` (`versionCode: 1`)
            - **Live Cloud Run Backend**: `${{ steps.backend.outputs.url }}`
            - **Offline Asset Fallback**: `androidx.webkit.WebViewAssetLoader` (`https://appassets.androidplatform.net`)
            - **Note**: Automatically connects to the live full-stack backend when online and falls back seamlessly to bundled assets offline.
          files: |
            android/app/build/outputs/apk/debug/ZENVIK-AGENT-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
          make_latest: true
