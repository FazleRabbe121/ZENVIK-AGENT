name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate, Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # No npm lockfile is committed yet; skip setup-node's lockfile cache lookup.

      - name: Install Frontend & Backend Dependencies
        run: npm install

      - name: TypeScript Validation
        run: npm run lint

      - name: Run Automated Unit & Integration Tests
        run: npm test

      - name: Build Production Web Application
        run: npm run build
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}

      - name: Bundle Web Assets into Android Assets (WebViewAssetLoader)
        run: |
          rm -rf android/app/src/main/assets/dist
          mkdir -p android/app/src/main/assets/dist
          cp -r dist/* android/app/src/main/assets/dist/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

      - name: Prepare Named APK Artifacts
        id: apk_path
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: APK file was not generated."
            exit 1
          fi
          cp "$APK_FILE" android/app/build/outputs/apk/debug/ZENVIK-AGENT-debug.apk
          echo "Found APK: $APK_FILE"
          echo "apk_file=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Upload ZENVIK Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZENVIK-AGENT-Android-Debug-APK
          path: |
            android/app/build/outputs/apk/debug/ZENVIK-AGENT-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish Latest Debug APK to GitHub Releases
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-debug
          name: ZENVIK Agent v1.0.0 (Debug APK Build)
          body: |
            Automated Android Debug APK build from commit `${{ github.sha }}`.
            - **Package ID**: `com.ccd.abetteryou.debug` (Base ID: `com.ccd.abetteryou`)
            - **Version**: `1.0.0` (`versionCode: 1`)
            - **Asset Loader**: `androidx.webkit.WebViewAssetLoader` (`https://appassets.androidplatform.net`)
            - **Note**: This is an automated Debug APK for testing and direct installation, not a Play Store signed production build.
          files: |
            android/app/build/outputs/apk/debug/ZENVIK-AGENT-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
          make_latest: true
