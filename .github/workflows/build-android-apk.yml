name: Build ZENVIK Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build ZENVIK-AGENT APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate TypeScript
        run: npm run lint

      - name: Build web application
        run: npm run build
        env:
          VITE_BASE_PATH: ./

      - name: Bundle web assets into existing Android WebView project
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/assets/dist
          mkdir -p android/app/src/main/assets/dist
          cp -R dist/. android/app/src/main/assets/dist/

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZENVIK-AGENT-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct latest APK download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="android-latest"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="android/app/build/outputs/apk/debug/ZENVIK-AGENT-Android.apk"
          test -f "$APK"
          cp "$APK" "$RELEASE_APK"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GH_REPO" --yes --cleanup-tag
          fi
          gh release create "$TAG" "$RELEASE_APK" \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "ZENVIK-AGENT Android — Latest" \
            --notes "Automated debug APK built from commit $GITHUB_SHA. Install on Android 8.0 or newer. This is a debug-signed build for testing." \
            --prerelease
