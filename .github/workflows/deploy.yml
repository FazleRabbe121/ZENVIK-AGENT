name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static site
        env:
          STATIC_SPA: "true"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Set repository variable VITE_BASE_PATH to /ZENVIK-AGENT/ for project Pages,
          # or leave it unset when deploying to a root custom domain.
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/ZENVIK-AGENT/' }}
        run: npm run build
      - name: Collect static output
        run: |
          OUT=""
          for d in dist/client .output/public dist; do [ -d "$d" ] && OUT="$d" && break; done
          [ -z "$OUT" ] && { echo "No build output found"; exit 1; }
          mkdir -p site && cp -r "$OUT"/. site/
          [ -f site/index.html ] || cp site/_shell.html site/index.html
          cp site/index.html site/404.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
